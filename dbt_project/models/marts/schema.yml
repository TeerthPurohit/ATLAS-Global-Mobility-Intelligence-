version: 2

models:
  - name: worldmove_city_hourly_shape
    description: "Real per-city hour-of-day demand shape from WorldMove trajectories -- replaces NYC's shape being applied to every non-NYC/London city."
    columns:
      - name: city_id
        tests: [not_null]
      - name: hour
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 23, inclusive: true}
      - name: pct_of_daily_trips
        tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1, inclusive: true}

  - name: zone_hourly_demand
    description: "Aggregated hourly demand per pickup zone"
    columns:
      - name: pickup_date
        tests: [not_null]
      - name: pickup_hour
        tests: [not_null]
      - name: pickup_location_id
        tests: [not_null]

  - name: zone_fare_stats
    description: "Fare statistics for each zone-to-zone pair"

  - name: zone_pair_flows
    description: "Daily origin-destination flow counts with ranking"

  - name: london_station_hourly_demand
    description: >
      Aggregated demand per Santander Cycle Hire docking station per real
      calendar date per hour (SPEC-015). Grain/column shape (station_id,
      trip_date, hour, day_of_week, total_trips, avg_duration_min)
      deliberately mirrors zone_hourly_demand's pickup_date/pickup_hour/
      pickup_location_id grain -- a real date column (not just day-of-week)
      is required for the chronological split (rule 3) demand-model training
      depends on. This is bike-share departure volume, not ride-hailing
      pickups -- not directly comparable to zone_hourly_demand's trip counts.
    columns:
      - name: station_id
        tests:
          - not_null
          # warn not error: same documented, measured station-churn gap as
          # int_london_journeys_enriched (see that model's schema.yml entry).
          - relationships:
              arguments:
                to: ref('stg_london_stations')
                field: station_id
              config:
                severity: warn
      - name: trip_date
        tests: [not_null]
      - name: hour
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 23
                inclusive: true
      - name: day_of_week
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 6
                inclusive: true
      - name: total_trips
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: avg_duration_min
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1440
                inclusive: false

  - name: canonical_areas
    description: >
      Cross-city area dimension (SPEC-013 FR-3, extended SPEC-016) -- wraps
      the NYC zone dimension (stg_zones + zone_centroids), London's
      Santander docking stations, and WorldMove grid cells for every other
      registered city into a generic (area_id, city_id, area_type,
      parent_area_id) shape backend/services/geography_service.py's
      list_areas()/get_area() read from.
    columns:
      - name: area_id
        tests:
          - not_null
          - unique
          # NOTE: no blanket relationships-to-stg_zones test here -- that
          # test existed before but only ever matched NYC rows; it silently
          # passed 0 failures because dbt's run_results.json predates this
          # model gaining London/WorldMove rows, not because it was correct.
          # 799/799 London area_ids fail it (verified 2026-08-13). Per-city
          # relationship checks live below instead of one test that's only
          # ever true for a third of the table.
      - name: area_type
        tests:
          - accepted_values:
              arguments:
                values: ["zone", "station", "grid_cell"]
      - name: city_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('cities')
                field: id
              config:
                # London/WorldMove area rows reference city_ids that live in
                # global_cities (or aren't registered as full OBSERVED cities
                # at all yet), not the 2-row `cities` seed -- same situation
                # zone_pair_flows already handles below with severity: warn.
                severity: warn
