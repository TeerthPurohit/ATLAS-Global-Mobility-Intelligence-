version: 2

models:
  - name: zone_hourly_demand
    description: "Aggregated hourly demand per pickup zone"
    columns:
      - name: pickup_date
        tests: [not_null]
      - name: pickup_hour
        tests: [not_null]
      - name: pickup_location_id
        tests: [not_null]

  - name: zone_fare_stats
    description: "Fare statistics for each zone-to-zone pair"

  - name: zone_pair_flows
    description: "Daily origin-destination flow counts with ranking"

  - name: canonical_areas
    description: >
      Area dimension -- the NYC zone dimension (stg_zones + zone_centroids)
      in the generic (area_id, city_id, area_type, parent_area_id) shape
      backend/services/geography_service.py's list_areas()/get_area() read
      from. NYC-only since ADR-012; the shape is kept so a future city adds
      rows rather than changing the table.
    columns:
      - name: area_id
        tests:
          - not_null
          - unique
          # Restored to a real test in ADR-012: this used to be omitted
          # because London/WorldMove rows made it fail for two-thirds of the
          # table. With NYC-only rows every area_id IS a stg_zones
          # location_id, so the check is both true and worth enforcing.
          - relationships:
              arguments:
                to: ref('stg_zones')
                field: location_id
      - name: area_type
        tests:
          - accepted_values:
              arguments:
                values: ["zone"]
      - name: city_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('cities')
                field: id

