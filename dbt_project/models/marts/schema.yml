version: 2

models:
  - name: zone_hourly_demand
    description: "Aggregated hourly demand per pickup zone"
    columns:
      - name: pickup_date
        description: "Calendar date of pickup (from int_trips_enriched.pickup_date). Part of this mart's grain: one row per (pickup_date, pickup_hour, pickup_location_id)."
        data_tests: [not_null]
      - name: pickup_hour
        description: "Hour of day (0-23) of pickup. Part of this mart's grain alongside pickup_date and pickup_location_id."
        data_tests: [not_null]
      - name: pickup_location_id
        description: "TLC taxi zone LocationID. Part of this mart's grain alongside pickup_date and pickup_hour; the join key the demand model ladder (models/data_prep/build_features.py) keys its target variable on."
        data_tests: [not_null]

  - name: zone_fare_stats
    description: "Fare statistics for each zone-to-zone pair"

  - name: zone_pair_flows
    description: "Daily origin-destination flow counts with ranking"

  - name: canonical_areas
    description: >
      Area dimension -- the NYC zone dimension (stg_zones + zone_centroids)
      in the (area_id, name, area_type, parent_area_id, latitude, longitude)
      shape backend/services/geography_service.py's list_areas()/get_area()
      read from. NYC-only since ADR-012; the constant city_id column was
      dropped in ADR-013.
    columns:
      - name: area_id
        description: "TLC taxi zone LocationID, aliased as area_id for the generalized Area API shape backend/services/geography_service.py reads. One row per NYC TLC zone -- this mart's grain."
        data_tests:
          - not_null
          - unique
          # Restored to a real test in ADR-012: this used to be omitted
          # because London/WorldMove rows made it fail for two-thirds of the
          # table. With NYC-only rows every area_id IS a stg_zones
          # location_id, so the check is both true and worth enforcing.
          - relationships:
              arguments:
                to: ref('stg_zones')
                field: location_id
      - name: area_type
        description: "Always 'zone' -- NYC-only (ADR-012) means there's currently only one geography type in play. A future non-zone-geography city would introduce other values here."
        data_tests:
          - accepted_values:
              arguments:
                values: ["zone"]
