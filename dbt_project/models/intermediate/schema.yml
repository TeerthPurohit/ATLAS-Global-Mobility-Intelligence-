version: 2

models:
  - name: int_trips_enriched
    description: "Trip records joined with zone metadata, plus computed time & speed columns"
    columns:
      - name: trip_id
        tests: [unique, not_null]
      - name: pickup_at
        tests: [not_null]
      - name: avg_speed_mph
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 OR avg_speed_mph IS NULL"

  - name: int_london_journeys_enriched
    description: "Santander Cycle Hire journeys joined with station metadata, plus computed time columns; duration outliers (<=0min, >24h) dropped (SPEC-015)"
    columns:
      - name: journey_id
        tests: [unique, not_null]
      - name: start_at
        tests: [not_null]
      - name: start_station_id
        tests:
          - not_null
          # warn not error: TfL's live BikePoint snapshot only reflects
          # currently-active docks -- a small, measured fraction of
          # journeys (~0.66%, 7 station ids) reference real but since-
          # decommissioned/renamed stations from the Jan-May 2026 journey
          # window. Real station churn, not a join bug (verified against
          # the raw TfL extracts) -- see stg_london_cycle_journeys.sql.
          - relationships:
              arguments:
                to: ref('stg_london_stations')
                field: station_id
              config:
                severity: warn
      - name: end_station_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_london_stations')
                field: station_id
              config:
                severity: warn
      - name: duration_minutes
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1440
                inclusive: false
