version: 2

models:
  - name: int_trips_enriched
    description: "Trip records joined with zone metadata, plus computed time & speed columns"
    columns:
      - name: trip_id
        description: "Synthetic surrogate key generated by row_number() over the load order -- the raw HVFHV parquet has no natural trip identifier. Passed through unchanged from stg_trips."
        data_tests: [unique, not_null]
      - name: pickup_at
        description: "Trip pickup timestamp. Passed through unchanged from stg_trips (renamed there from the raw `pickup_datetime` column)."
        data_tests: [not_null]
      - name: avg_speed_mph
        description: "trip_distance / (trip_duration_minutes / 60.0). NULL when trip_duration_minutes <= 0, to avoid a divide-by-zero rather than dropping the row."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 OR avg_speed_mph IS NULL"
