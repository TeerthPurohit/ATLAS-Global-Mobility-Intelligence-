version: 2

sources:
  - name: nyc_tlc
    description: "NYC TLC Trip Record Data — HVFHV (Uber/Lyft) parquet files loaded by scripts/load_raw_to_duckdb.py"
    database: nyc_rides
    schema: main
    tables:
      - name: raw_trips
        description: "Raw HVFHV trip records (High Volume For-Hire Vehicle — Uber/Lyft)"

models:
  - name: stg_trips
    description: "Cleaned and typed trip records from raw parquet data"
    columns:
      - name: trip_id
        tests: [unique, not_null]
      - name: pickup_at
        tests: [not_null]
      - name: dropoff_at
        tests: [not_null]
      - name: pickup_location_id
        tests: [not_null]
      - name: dropoff_location_id
        tests: [not_null]
      - name: total_amount
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000
                inclusive: false

  - name: stg_zones
    description: "Processed taxi zone lookups"
    columns:
      - name: location_id
        tests: [unique, not_null]
      - name: borough
        tests: [not_null]
      - name: zone_name
        tests: [not_null]
