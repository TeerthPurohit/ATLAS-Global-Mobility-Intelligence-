version: 2

sources:
  - name: nyc_tlc
    description: "NYC TLC Trip Record Data — HVFHV (Uber/Lyft) parquet files loaded by scripts/load_raw_to_duckdb.py"
    database: nyc_rides
    schema: main
    tables:
      - name: raw_trips
        description: "Raw HVFHV trip records (High Volume For-Hire Vehicle — Uber/Lyft)"

models:
  - name: stg_trips
    description: "Cleaned and typed trip records from raw parquet data"
    columns:
      - name: trip_id
        description: "Synthetic surrogate key generated by row_number() over the load order -- the raw HVFHV parquet has no natural trip identifier."
        data_tests: [unique, not_null]
      - name: pickup_at
        description: "Trip pickup timestamp (renamed from the raw `pickup_datetime` column)."
        data_tests: [not_null]
      - name: dropoff_at
        description: "Trip dropoff timestamp (renamed from the raw `dropoff_datetime` column)."
        data_tests: [not_null]
      - name: pickup_location_id
        description: "TLC taxi zone LocationID where the trip started (renamed from `PULocationID`); joins to `stg_zones.location_id`."
        data_tests: [not_null]
      - name: dropoff_location_id
        description: "TLC taxi zone LocationID where the trip ended (renamed from `DOLocationID`); joins to `stg_zones.location_id`."
        data_tests: [not_null]
      - name: total_amount
        description: "fare_amount + tolls + bcf + sales_tax + congestion_surcharge + airport_fee + tip_amount -- HVFHV has no native total_amount column, so it's built here. Rows outside (0, 1000) are dropped by this model's WHERE clause (comped/refunded trips and implausible outlier fares)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000
                inclusive: false

  - name: stg_zones
    description: "Processed taxi zone lookups"
    columns:
      - name: location_id
        description: "TLC taxi zone identifier (renamed from `LocationID`) -- the join key every trip's pickup/dropoff location resolves against."
        data_tests: [unique, not_null]
      - name: borough
        description: "NYC borough the zone belongs to (renamed from `Borough`)."
        data_tests: [not_null]
      - name: zone_name
        description: "Human-readable zone name (renamed from `Zone`)."
        data_tests: [not_null]
