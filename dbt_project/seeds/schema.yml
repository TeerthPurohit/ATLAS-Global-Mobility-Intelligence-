version: 2

seeds:
  - name: taxi_zone_lookup
    description: "Official NYC TLC taxi zone lookup (LocationID/Borough/Zone/service_zone)."

  - name: vehicle_profiles
    description: >
      Per-vehicle-class factors used by backend/services/pricing_engine.py and
      backend/services/vehicle_profiles.py to scale fare/carbon/availability
      predictions by vehicle type, instead of hardcoded per-class branches
      (see ADR-007). base_fare_factor / distance_rate_factor / time_rate_factor
      / minimum_fare_factor / traffic_sensitivity / demand_sensitivity /
      availability_prior are illustrative product-configuration multipliers
      (a rate-card decision, not a measured fact) with mini/sedan as the 1.0
      baseline. emission_factor (kg CO2 per mile) is anchored to the EPA's
      widely-cited ~0.404 kg CO2/mile average U.S. passenger vehicle figure
      (https://www.epa.gov/greenvehicles/greenhouse-gas-emissions-typical-passenger-vehicle),
      scaled qualitatively by class (bike/auto lower, SUV/premium higher);
      it is an order-of-magnitude reference, not a per-model figure. EV is
      tailpipe-only (0.0) -- grid-mix generation emissions are not modeled,
      a documented limitation, not an implicit "zero impact" claim.
    columns:
      - name: vehicle_class
        tests: [not_null, unique]

  - name: countries
    description: >
      Sovereign-state registry for the Global Mobility Domain Model
      (SPEC-013). `supported` is never stored here -- it's derived at query
      time in backend/registry/countries.py by joining against `cities` (a
      country is "supported" iff it has >=1 city row), avoiding a
      denormalized flag that can drift from the city list.
    columns:
      - name: iso_code
        tests: [not_null, unique]
      - name: name
        tests: [not_null]

  - name: cities
    description: >
      City registry for the Global Mobility Domain Model (SPEC-013). One
      real row this phase (`nyc`) -- a second city (e.g. London, SPEC-015)
      joins by adding a row here plus matching `model_registry` rows, with
      zero code changes to backend/registry/*.py. `capabilities`/`metrics`
      are deliberately NOT columns here (they'd drift from reality) --
      backend/registry/cities.py computes them from `model_registry` and the
      datasource registry instead. `model_status` here is a seed-time
      default; backend/registry/cities.py recomputes the effective value
      from live `model_registry` rows so a future city's status flips to
      "active" automatically once its models actually land.
    columns:
      - name: id
        tests: [not_null, unique]
      - name: country_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('countries')
                field: iso_code
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ["active", "planned"]

  - name: model_registry
    description: >
      Catalogs prediction-model artifacts that already exist on disk (no
      retraining) -- one row per (city, metric, model version).
      backend/registry/models.py validates `artifact_path` exists at
      startup; a missing file demotes `status` to "unavailable" rather than
      crashing or silently serving nothing.
    columns:
      - name: model_id
        tests: [not_null, unique]
      - name: city_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('cities')
                field: id
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ["active", "unavailable"]

  - name: london_stations
    description: >
      Santander Cycle Hire docking-station locations (SPEC-015), a direct
      snapshot of TfL's live BikePoint API (https://api.tfl.gov.uk/BikePoint)
      written by scripts/ingest_tfl_cycle_hire.py. station_id is BikePoint's
      TerminalName, the same zero-padded id used in the journey extracts'
      "Start/End station number" columns. Also mirrored, unchanged, to
      data/lookup/london_station_centroids.csv for algorithms/spatial's
      KD-tree (same role zone_centroids.csv plays for NYC).
    columns:
      - name: station_id
        tests: [not_null, unique]
      - name: name
        tests: [not_null]

  - name: zone_centroids
    description: >
      Real NYC TLC zone centroids (same source data as
      data/lookup/zone_centroids.csv, used directly by
      algorithms/spatial/kdtree_zone_lookup.py) -- seeded so
      canonical_areas.sql can join latitude/longitude onto stg_zones without
      a mart reading a mart (rule 6).
    columns:
      - name: LocationID
        tests: [not_null, unique]
