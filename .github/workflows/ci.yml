name: CI

# Deliberately minimal — solo project, no merge-queue/multi-committer concerns.
# See docs/architecture/Infrastructure.md and .claude/rules.md rule 7.
# Add stages only when a real gap bites (e.g. dbt test in CI once Layer 1 is
# stable), not speculatively.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: pip install ruff && ruff check .
      - name: Test
        # ~111 of 162 tests skip here (module-level `skipif(not
        # WAREHOUSE_PATH.exists())`): they need the real 113M-row, 12GB
        # DuckDB warehouse, which is gitignored and not built by this
        # workflow -- reconstructing it from raw TLC data in a shared
        # runner isn't practical for a solo project (rule 7, no speculative
        # infra). Those tests are local/pre-deploy verification, run
        # against a real `data/warehouse/nyc_rides.duckdb`, not CI-gated.
        # The remaining ~51 (schema/unit/algorithm-level, plus everything
        # here that only needs DATABASE_URL) run for real and gate the build.
        run: pytest tests/ -q
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  frontend:
    runs-on: ubuntu-latest
    if: false # flip on once frontend/package.json has real dependencies installed (Layer 5) — see specs/010-frontend/spec.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
