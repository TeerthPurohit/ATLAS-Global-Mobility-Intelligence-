name: CI

# Deliberately minimal — solo project, no merge-queue/multi-committer concerns.
# See docs/architecture/Infrastructure.md and .claude/rules.md rule 7.
# Add stages only when a real gap bites (e.g. dbt test in CI once Layer 1 is
# stable), not speculatively.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: pip install ruff && ruff check .
      - name: Test
        run: pytest tests/ -q
        continue-on-error: true # no tests exist yet for most layers — flip off once tests/ has real coverage

  frontend:
    runs-on: ubuntu-latest
    if: false # flip on once frontend/package.json has real dependencies installed (Layer 5) — see specs/010-frontend/spec.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
