version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    env_file: .env
    environment:
      - OSRM_BASE_URL=http://osrm:5000
    volumes:
      - ./data/warehouse:/app/data/warehouse:ro
      - ./models:/app/models:ro
      - ./certs:/app/certs:ro
    depends_on:
      - osrm
    # --workers 1: each worker independently reloads the full multi-GB model
    # set (XGBoost/LSTM/Transformer + DuckDB feature build) at startup -- 4
    # workers means 4x the memory for no benefit on this VM's shared 2 OCPU/
    # 12GB budget (also running the QueryPlan llama.cpp server).
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 1

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ./data/osrm:/data:ro
    command: osrm-routed --algorithm mld /data/new-york-latest.osrm

volumes:
  caddy_data:
  caddy_config:
