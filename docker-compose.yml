services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./backend:/app/backend
      - ./rag:/app/rag
      - ./dbt_project:/app/dbt_project
      # RDS TLS CA bundle (ADR-009): rag/session_store.py and
      # backend/services/prediction_log.py both need this at
      # POSTGRES_SSLROOTCERT (certs/global-bundle.pem) for sslmode=verify-full.
      # Neither the Dockerfile's COPY list nor this file previously included
      # it, so every Postgres connection failed before it could even attempt
      # TLS (found via /debug 2026-08-13, after fixing the actually-missing
      # psycopg dependency surfaced the next layer of the same gap). Read-only
      # -- it's a public CA bundle, nothing here ever writes to it.
      - ./certs:/app/certs:ro
    depends_on:
      - qdrant
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Read server-side by next.config.js's rewrites() to proxy the browser's
      # /api/* calls to the backend -- the Docker network hostname works here
      # (unlike the old NEXT_PUBLIC_API_BASE_URL build arg) because this is
      # resolved by the Next.js server inside the container, never the browser.
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  qdrant_storage:
