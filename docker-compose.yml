services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./backend:/app/backend
      - ./rag:/app/rag
      - ./dbt_project:/app/dbt_project
    depends_on:
      - qdrant
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined at build time, and this URL is resolved by the
        # user's browser -- not from inside the container -- so it must be the
        # host-published address, never http://backend:8000.
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  qdrant_storage:
